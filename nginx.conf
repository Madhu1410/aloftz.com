    # ── Clean URL → .html internal rewrite (core pages)
    location = /about       { try_files /about.html =404; }
    location = /services    { try_files /services.html =404; }
    location = /work        { try_files /work.html =404; }
    location = /blog        { try_files /blog.html =404; }
    location = /contact     { try_files /contact.html =404; }
    location = /appointment { try_files /appointment.html =404; }

    # ── Clean URL → .html internal rewrite (blog posts)
    location = /blog/7-seo-mistakes-agency-google-rankings {
