# ── Redirect HTTP → HTTPS (port 80)
server {
    listen 80;
    server_name aloftz.com www.aloftz.com;
    return 301 https://www.aloftz.com$request_uri;
}

# ── Redirect non-www → www (HTTPS)
server {
    listen 443 ssl http2;
    server_name aloftz.com;
    # ssl_certificate / ssl_certificate_key here
    return 301 https://www.aloftz.com$request_uri;
}

# ── Main www server
server {
    listen 443 ssl http2;
    server_name www.aloftz.com;
    root /var/www/aloftz;
    index index.html;

    # ── Strip trailing slashes (except /)
    rewrite ^(/[^/]+)/+$ $1 permanent;

    # ── 301: .html → clean URL (core pages)
    location = /index.html       { return 301 /; }
    location = /about.html       { return 301 /about; }
    location = /services.html    { return 301 /services; }
    location = /work.html        { return 301 /work; }
    location = /blog.html        { return 301 /blog; }
    location = /contact.html     { return 301 /contact; }
    location = /appointment.html { return 301 /appointment; }
    location = /home.html        { return 301 /; }

    # ── 301: blog post .html → clean URLs
    location = /7-seo-mistakes-blog.html {
        return 301 /blog/7-seo-mistakes-agency-google-rankings; }
    location = /blog-ai-copywriting.html {
        return 301 /blog/ai-vs-human-copywriters-2026; }
    location = /blog-ai-landing-page.html {
        return 301 /blog/ai-landing-page-2-hours; }
